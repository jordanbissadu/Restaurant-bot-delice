[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "restaurant-bot-delice"
version = "0.1.0"
description = "Bot Telegram RAG pour le restaurant Le Delice (Lome, Togo)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "pymongo>=4.9",
    "openai>=1.50",
    "docling>=2.0",
    "google-api-python-client>=2.140",
    "google-auth>=2.34",
    "apscheduler>=3.10",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-telegram-bot>=21.5",
    "pydantic-ai>=0.4.2",
    "cohere>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "unit: tests sans dependance externe",
    "integration: tests necessitant MongoDB / OpenAI / Drive",
    "e2e: parcours conversationnel complet",
]

[tool.setuptools.packages.find]
include = ["src*"]
