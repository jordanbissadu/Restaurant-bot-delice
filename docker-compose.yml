services:
  worker:
    build: .
    command: python -m src.worker
    env_file: .env
    volumes:
      - ./credentials:/app/credentials:ro
    restart: unless-stopped

  api:
    build: .
    command: uvicorn src.api:app --host 0.0.0.0 --port 8000
    env_file: .env
    volumes:
      - ./credentials:/app/credentials:ro
    ports:
      - "8000:8000"
    restart: unless-stopped
